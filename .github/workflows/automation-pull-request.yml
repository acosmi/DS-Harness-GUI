name: Open automation pull request

on:
  push:
    branches:
      - 'codex/automation/**'

concurrency:
  group: automation-pull-request-${{ github.ref }}
  cancel-in-progress: true

# The repository-level Actions setting permits pull-request creation. This job
# receives the only write scope and never changes branch contents or reviews.
permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    name: open draft pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open draft pull request if absent
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          existing_url="$(
            gh pr list \
              --repo "$REPOSITORY" \
              --head "$HEAD_BRANCH" \
              --base "$BASE_BRANCH" \
              --state open \
              --json url \
              --jq ".[0].url // empty"
          )"
          if [[ -n "$existing_url" ]]; then
            echo "Open pull request already exists: $existing_url"
            exit 0
          fi

          task="${HEAD_BRANCH#codex/automation/}"
          printf -v body \
            'This draft pull request was opened automatically for branch %s.\n\nAutomation may continue pushing commits to the same branch. It must not approve or merge this pull request. A repository administrator merges it after the required checks and review are complete.' \
            "$HEAD_BRANCH"
          created_url="$(
            gh pr create \
              --repo "$REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$HEAD_BRANCH" \
              --draft \
              --title "chore: review automated changes ($task)" \
              --body "$body"
          )"
          echo "Created draft pull request: $created_url"
