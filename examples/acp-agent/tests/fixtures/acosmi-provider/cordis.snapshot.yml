# Keyless Acosmi provider composition. The ordinary ACP example supplies the
# real agent, tools, session persistence, and transport; only its network LLM
# route is replaced by the real downstream adapter over a deterministic account
# boundary. The web tool remains model-visible so the fixture can reject a
# duplicate client web_search before returning a managed-search response.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../../cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        config:
          provider: acosmi
          model: managed-kimi-k3
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: web
            name: '@deepseek-ai/dsh-web'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              search: true
              fetch: false
          - id: acosmi-account-fixture
            name: './tests/fixtures/acosmi-provider/fake-account.ts'
          - id: llm-acosmi
            name: '../../downstream/packages/llm-acosmi/src/index.ts'
            config:
              maxTokens: 8192
              streamIdleTimeoutMs: 30000
